<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4fa">
<title>Mes Tatouages</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
html{background:#f7efe7}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#25233f;
  background:#f7efe7;
  position:relative;
  isolation:isolate;
}
/* Fond uni : aucun motif décoratif en arrière-plan. */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#25233f;
  background:#f7efe7;
  position:relative;
  isolation:isolate;
}

.app{width:100%;margin:0;padding:18px 14px 34px;position:relative;z-index:1}
.top,.search,.bottom{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.top{display:flex;gap:12px;align-items:stretch}
.title{
  flex:1;background:rgba(255,252,247,.9);border:1.5px solid rgba(111,82,211,.15);
  border-radius:24px;padding:15px 20px;box-shadow:0 8px 24px rgba(70,55,100,.08);
  backdrop-filter:blur(5px)
}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,8vw,48px);line-height:1.02;font-weight:700;letter-spacing:-1px;color:#252044}
.count{margin-top:7px;font-size:18px;color:#62577e}
.add{
  width:104px;min-width:104px;border:0;border-radius:25px;color:#fff;font-size:48px;line-height:1;
  background:linear-gradient(145deg,#7a5aeb,#5845d8);box-shadow:0 10px 24px rgba(87,70,210,.22)
}
.search{
  margin-top:12px;background:rgba(255,252,247,.9);border:1.5px solid rgba(111,82,211,.13);border-radius:24px;
  padding:12px 16px 13px;box-shadow:0 8px 24px rgba(70,55,100,.07);backdrop-filter:blur(5px)
}
input{width:100%;border:0;outline:0;background:transparent;font-size:18px;color:#25233f;padding:4px 6px}
input::placeholder{color:#9c9aaa}
.tabs{display:flex;gap:9px;margin-top:10px}
.tab{
  border:1.5px solid rgba(111,82,211,.16);background:rgba(255,255,255,.78);color:#5148c8;border-radius:20px;
  padding:8px 18px;font-size:16px
}
.tab.active{background:#282242;color:#fff;border-color:#282242}
.boardViewport{
  position:relative;width:100vw;margin:12px 0 0 -14px;overflow:hidden;background:transparent;border:0;border-radius:0;
  touch-action:pan-y;
}
.board{
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  position:relative;left:0;top:0;width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;
  padding:0 10px;transform-origin:top left;will-change:transform;z-index:2;
}
.cell{
  width:auto;height:auto;aspect-ratio:.86;padding:0;border:2px dashed rgba(103,88,222,.48);
  border-radius:19px;background:rgba(255,250,245,.86);overflow:hidden;position:relative;
  appearance:none;-webkit-appearance:none;color:#5c50d9;display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset
}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.plus{font-size:31px;color:#5d50d9;font-weight:400;line-height:1}
.bottom{display:flex;justify-content:center;gap:9px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:3}
.btn{
  border:0;background:rgba(255,252,247,.92);color:#5148c8;border-radius:20px;padding:11px 18px;
  font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(70,55,100,.08)
}
@media (max-width:480px){
  .app{padding-left:12px;padding-right:12px}
  .boardViewport{margin-left:-12px}
  .title{padding:14px 16px}
  .add{width:88px;min-width:88px;font-size:43px}
  .cell{border-width:2px;border-radius:17px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">
      <h1>Mes Tatouages</h1>
      <div class="count"><span id="count">0</span> / <span id="total">60</span> tatouages</div>
    </div>
    <button class="add" id="addOne" aria-label="Ajouter">+</button>
  </div>

  <div class="search">
    <input id="search" placeholder="Rechercher un tatouage, style, client..." />
    <div class="tabs">
      <button class="tab active">Récent</button>
      <button class="tab">Ancien</button>
      <button class="tab">A-Z</button>
    </div>
  </div>

  <div class="boardViewport" id="vp">
    <div class="board" id="board"></div>
  </div>

  <div class="bottom">
    <button class="btn" id="more">＋ Ajouter 12 cases</button>
    <button class="btn" id="fit">↺ Vue de base</button>
  </div>
</div>

<script>
const board=document.querySelector('#board'),vp=document.querySelector('#vp');
const count=document.querySelector('#count'),totalEl=document.querySelector('#total');
let total=60;
let items=JSON.parse(localStorage.getItem('tattooItems')||'[]');
const BASE_ZOOM=1.25;
let scale=BASE_ZOOM,tx=0,ty=0;
let drag=false,sx=0,sy=0,ox=0,oy=0;
let pinchStart=0,pinchScale=1;

function save(){localStorage.setItem('tattooItems',JSON.stringify(items))}
function getMetrics(){
  const cols=6;
  const bw=window.innerWidth;
  const cellW=(bw-20-(cols-1)*5)/cols;
  const cellH=cellW/0.86;
  const rows=Math.ceil(total/cols);
  const bh=rows*cellH+(rows-1)*5;
  return {bw,cellW,cellH,bh,cols,rows};
}
function maxZoom(){
  // À fond, une seule carte occupe toute la largeur du plateau.
  // Le plateau démarre à BASE_ZOOM pour afficher des cases plus grandes.
  const m=getMetrics();
  return Math.max(1,m.bw/m.cellW);
}
function clampPan(){
  const m=getMetrics();
  const contentW=m.bw*scale;
  const contentH=m.bh*scale;
  const viewH=m.bh;
  const minX=Math.min(0,m.bw-contentW);
  const minY=Math.min(0,viewH-contentH);
  tx=Math.min(0,Math.max(minX,tx));
  ty=Math.min(0,Math.max(minY,ty));
  if(scale<=1.001){tx=0;ty=0}
}
function updateTouchMode(){
  vp.style.touchAction=scale>1.001?'none':'pan-y';
}
function apply(){
  clampPan();
  board.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;
  updateTouchMode();
}
function render(){
  board.innerHTML='';
  for(let i=0;i<total;i++){
    const b=document.createElement('button');
    b.className='cell';b.type='button';
    if(items[i]?.src){
      const im=document.createElement('img');im.src=items[i].src;im.alt='Tatouage '+(i+1);b.append(im);
    }else{
      const p=document.createElement('span');p.className='plus';p.textContent='+';b.append(p);
    }
    b.addEventListener('click',()=>photo(i));
    board.append(b);
  }
  count.textContent=items.filter(Boolean).length;totalEl.textContent=total;
  fit();
}
function photo(i){
  const f=document.createElement('input');f.type='file';f.accept='image/*';
  f.onchange=()=>{
    if(!f.files[0])return;
    const r=new FileReader();
    r.onload=()=>{items[i]={src:r.result};save();render()};
    r.readAsDataURL(f.files[0]);
  };
  f.click();
}
function fit(){
  const m=getMetrics();
  vp.style.height=m.bh+'px';
  scale=BASE_ZOOM;tx=0;ty=0;apply();
}
function zoomAt(next,x,y){
  const old=scale;
  scale=Math.max(1,Math.min(maxZoom(),next));
  const ratio=scale/old;
  tx=x-(x-tx)*ratio;
  ty=y-(y-ty)*ratio;
  apply();
}
document.querySelector('#fit').addEventListener('click',fit);
document.querySelector('#more').addEventListener('click',()=>{total+=12;render()});
document.querySelector('#addOne').addEventListener('click',()=>{total++;render()});
window.addEventListener('resize',()=>{const wasZoomed=scale>1.001; if(!wasZoomed) fit(); else {vp.style.height=getMetrics().bh+'px'; scale=Math.min(scale,maxZoom());apply();}});

vp.addEventListener('pointerdown',e=>{
  if(scale<=1.001 || e.pointerType==='touch' && e.isPrimary===false)return;
  drag=true;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove',e=>{
  if(!drag || scale<=1.001)return;
  e.preventDefault();
  tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply();
});
function endDrag(){drag=false}
vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);vp.addEventListener('pointerleave',endDrag);

vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect();
  zoomAt(scale*(e.deltaY<0?1.1:.9),e.clientX-r.left,e.clientY-r.top);
},{passive:false});

vp.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchScale=scale;
  }
},{passive:false});
vp.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const r=vp.getBoundingClientRect();
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    zoomAt(pinchScale*d/pinchStart,cx,cy);
  }else if(scale>1.001 && e.touches.length===1){
    e.preventDefault();
  }
},{passive:false});

// Le défilement vertical de la page reste natif quand le plateau est dézoomé.
document.querySelector('#search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  [...board.children].forEach((c,i)=>{
    c.style.opacity=!q||JSON.stringify(items[i]||'').toLowerCase().includes(q)?1:.25;
  });
});
render();
</script>
</body>
</html>
