<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4fa">
<title>Mes Tatouages</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#17324d;
  background:
    radial-gradient(circle at 3% 42%,#fff3a8 0 55px,transparent 56px),
    radial-gradient(circle at 97% 57%,#ffd4ea 0 70px,transparent 71px),
    linear-gradient(135deg,#fffafd,#eaf7ff);
}
.app{max-width:900px;margin:auto;padding:12px 12px 35px}

/* En-tête beaucoup plus petit */
.top{display:flex;gap:10px;align-items:stretch}
.title{
  flex:1;background:#fff;border:2px solid #d6e8f6;border-radius:20px;
  padding:13px 17px;box-shadow:0 6px 18px #719fc51a
}
h1{margin:0;font-size:30px;line-height:1.05;font-weight:850}
.count{margin-top:5px;font-size:17px;color:#7894a8}
.add{
  width:76px;border:0;border-radius:20px;color:#fff;font-size:42px;
  background:linear-gradient(145deg,#4d8df7,#756df4);
  box-shadow:0 7px 18px #547ce626
}

/* Recherche compacte */
.search{
  margin-top:10px;background:#fff;border:2px solid #d6e8f6;border-radius:20px;
  padding:11px 14px;box-shadow:0 6px 18px #719fc51a
}
input{width:100%;border:0;outline:0;font-size:17px;color:#17324d}
input::placeholder{color:#aeb8c0}
.tabs{display:flex;gap:7px;margin-top:8px}
.tab{
  border:2px solid #d5e7f6;background:#fff;color:#3479df;border-radius:18px;
  padding:7px 15px;font-size:15px
}
.tab.active{background:#17324d;color:#fff;border-color:#17324d}

/* Pas de texte explicatif inutile */
.boardTitle{
  margin:11px 2px 7px;font-size:18px;font-weight:800;color:#4c7896
}

/* Le plateau est VISIBLE immédiatement sur l'accueil */
.boardViewport{
  position:relative;width:100%;height:520px;overflow:hidden;
  border-radius:22px;background:rgba(255,255,255,.38);
  border:2px solid #c6e2f4;touch-action:none;
}
.board{
  position:absolute;left:0;top:0;
  width:510px;
  display:grid;grid-template-columns:repeat(6,78px);gap:7px;
  transform-origin:0 0;
}
.cell{
  width:78px;height:91px;padding:0;border:2px dashed #9ecde9;
  border-radius:15px;background:linear-gradient(145deg,#fff,#eefaff);
  overflow:hidden;position:relative;
}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.plus{font-size:30px;color:#64a9df;font-weight:300}
.num{
  position:absolute;top:4px;left:4px;background:#ffffffdd;color:#7893a6;
  border-radius:7px;padding:2px 5px;font-size:9px;font-weight:700
}
.bottom{display:flex;justify-content:center;gap:8px;margin-top:10px}
.btn{
  border:0;background:#fff;color:#2874dc;border-radius:17px;padding:10px 16px;
  font-size:15px;font-weight:800;box-shadow:0 6px 16px #6c9ec51a
}
.hint{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">
      <h1>Mes Tatouages</h1>
      <div class="count"><span id="count">0</span> / <span id="total">60</span> tatouages</div>
    </div>
    <button class="add" id="addOne" aria-label="Ajouter">+</button>
  </div>

  <div class="search">
    <input id="search" placeholder="Rechercher un tatouage, style, client..." />
    <div class="tabs">
      <button class="tab active">Récent</button>
      <button class="tab">Ancien</button>
      <button class="tab">A-Z</button>
    </div>
  </div>

  <div class="boardTitle">🧩 Mon plateau — 60 cases</div>
  <div class="boardViewport" id="vp">
    <div class="board" id="board"></div>
  </div>

  <div class="bottom">
    <button class="btn" id="more">＋ Ajouter 12 cases</button>
    <button class="btn" id="fit">↺ Voir tout</button>
  </div>
</div>

<script>
const board=document.querySelector('#board'),vp=document.querySelector('#vp');
const count=document.querySelector('#count'),totalEl=document.querySelector('#total');
let total=60;
let items=JSON.parse(localStorage.getItem('tattooItems')||'[]');
let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0,ox=0,oy=0,pinch=0,pinchScale=1;

function save(){localStorage.setItem('tattooItems',JSON.stringify(items))}
function render(){
 board.innerHTML='';
 for(let i=0;i<total;i++){
  const b=document.createElement('button');b.className='cell';b.type='button';
  if(items[i]?.src){
   const im=document.createElement('img');im.src=items[i].src;im.alt='Tatouage '+(i+1);b.append(im);
  }else{
   const n=document.createElement('span');n.className='num';n.textContent=i+1;b.append(n);
   const p=document.createElement('span');p.className='plus';p.textContent='+';b.append(p);
  }
  b.onclick=()=>photo(i);board.append(b);
 }
 count.textContent=items.filter(Boolean).length;totalEl.textContent=total;
 fit();
}
function photo(i){
 const f=document.createElement('input');f.type='file';f.accept='image/*';
 f.onchange=()=>{
  if(!f.files[0])return;
  const r=new FileReader();
  r.onload=()=>{items[i]={src:r.result};save();render()};
  r.readAsDataURL(f.files[0]);
 };
 f.click();
}
function fit(){
 const cols=6,rows=Math.ceil(total/cols);
 const bw=6*78+5*7;
 const bh=rows*91+(rows-1)*7;
 scale=Math.min((vp.clientWidth-10)/bw,(vp.clientHeight-10)/bh);
 scale=Math.max(.2,Math.min(scale,1));
 tx=(vp.clientWidth-bw*scale)/2;
 ty=(vp.clientHeight-bh*scale)/2;
 apply();
}
function apply(){board.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
document.querySelector('#fit').onclick=fit;
document.querySelector('#more').onclick=()=>{total+=12;render()};
document.querySelector('#addOne').onclick=()=>{total++;render()};
window.addEventListener('resize',fit);

vp.addEventListener('pointerdown',e=>{
 drag=true;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;vp.setPointerCapture(e.pointerId)
});
vp.addEventListener('pointermove',e=>{
 if(!drag)return;tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply()
});
vp.addEventListener('pointerup',()=>drag=false);
vp.addEventListener('pointercancel',()=>drag=false);

vp.addEventListener('wheel',e=>{
 e.preventDefault();
 const old=scale,next=Math.max(.2,Math.min(2.5,old*(e.deltaY<0?1.1:.9)));
 const r=vp.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 tx=x-(x-tx)*(next/old);ty=y-(y-ty)*(next/old);scale=next;apply()
},{passive:false});

vp.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                   e.touches[0].clientY-e.touches[1].clientY);
  pinchScale=scale;
 }
},{passive:true});
vp.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  scale=Math.max(.2,Math.min(2.5,pinchScale*d/pinch));apply();
 }
},{passive:true});

document.querySelector('#search').oninput=e=>{
 const q=e.target.value.toLowerCase();
 [...board.children].forEach((c,i)=>{
  c.style.opacity=!q||JSON.stringify(items[i]||'').toLowerCase().includes(q)?1:.25
 });
};
render();
</script>
</body>
</html>
