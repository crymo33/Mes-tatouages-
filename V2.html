<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef8ff">
<title>Mes Tatouages — Collection</title>
<style>
:root{--bg:#eaf6ff;--ink:#10212a;--muted:#71818a;--blue:#1769db;--line:#b8d5e5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}
.app{width:100vw;height:100vh;position:relative;overflow:hidden;background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.42),transparent 55%),
 #eaf6ff}
.boardViewport{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.board{width:1240px;height:1240px;padding:54px;display:grid;grid-template-columns:repeat(6,170px);grid-auto-rows:190px;gap:24px}
.slot,.card{width:170px;height:190px;border-radius:25px}
.slot{border:3px dashed #b5d2e2;background:rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6d8794;cursor:pointer;box-shadow:0 8px 18px rgba(40,100,130,.06)}
.slot:active{transform:scale(.98)}.slot:hover{background:#fff8d9}.plus{box-shadow:0 5px 14px #0001}
.plus{width:54px;height:54px;border-radius:18px;background:#cfe8f7;color:#66a0c0;font-size:38px;display:flex;align-items:center;justify-content:center}
.slot small{margin-top:9px;font-size:11px;font-weight:800}
.card{background:#fff;border:1px solid #d7e8f1;overflow:hidden;box-shadow:0 9px 24px rgba(24,55,70,.13);cursor:pointer}
.card img{display:block;width:100%;height:142px;object-fit:cover}
.info{height:48px;padding:7px 10px;background:#fff}
.name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:var(--muted);margin-top:2px}
.badge{display:none}
.hud{position:fixed;z-index:8;left:14px;right:14px;top:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.hudLeft,.hudRight{display:flex;gap:8px;align-items:center;pointer-events:auto}
.hudTitle{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid #d7e8f1;border-radius:15px;padding:8px 12px;box-shadow:0 6px 18px rgba(24,55,70,.08)}
.hudTitle b{font-size:15px}.hudTitle span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.hud button{width:46px;height:46px;border:0;border-radius:15px;background:rgba(255,255,255,.92);color:var(--blue);font-size:30px;box-shadow:0 6px 18px rgba(24,55,70,.12)}
.hud button:active{transform:scale(.95)}
.searchHud{position:fixed;z-index:8;top:72px;left:14px;width:calc(100vw - 28px);max-width:390px}
.searchHud input{width:100%;padding:11px 14px;border:1px solid #d7e8f1;border-radius:15px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);outline:0;font-size:14px;box-shadow:0 6px 18px rgba(24,55,70,.08)}
.sortHud{position:fixed;z-index:8;right:14px;top:72px;display:flex;gap:5px}
.sortHud button{border:1px solid #d7e8f1;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 10px;font-size:11px}
.sortHud .active{background:var(--ink);color:#fff}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:94vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px 30px}.row{display:flex;align-items:center;justify-content:space-between}.close{width:42px;height:42px;border:0;border-radius:12px;background:#edf2f5;font-size:24px}
label{display:block;font-size:13px;font-weight:750;margin-top:14px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;font-size:16px}textarea{min-height:85px}.preview{display:none;width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-top:10px}.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.detail{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:14px}.detail.open{display:flex}.detailBox{width:100%;max-width:700px;max-height:94vh;overflow:auto;background:#fff;border-radius:25px}.detailBox img{width:100%;max-height:65vh;object-fit:contain;background:#111;border-radius:25px 25px 0 0}.detailInfo{padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:13px;padding:12px 14px}.danger{background:#fff0f0;color:#b42323}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="hudLeft">
      <div class="hudTitle"><b>Mes Tatouages</b><span id="count">0 / 36</span></div>
    </div>
    <div class="hudRight">
      <button id="addTop" type="button" aria-label="Ajouter">+</button>
    </div>
  </div>
  <div class="searchHud"><input id="search" placeholder="Rechercher…"></div>
  <div class="sortHud">
    <button class="tab active" data-sort="new">Récent</button>
    <button class="tab" data-sort="old">Ancien</button>
    <button class="tab" data-sort="az">A-Z</button>
  </div>
  <div class="boardViewport" id="boardViewport">
    <main class="board" id="grid"></main>
  </div>
</div>

<div class="overlay" id="formOverlay"><div class="sheet"><div class="row"><h2 id="formTitle">Ajouter un tatouage</h2><button class="close" id="closeForm">×</button></div>
<form id="form">
<input type="hidden" id="editId">
<label>Photo</label><input id="photo" type="file" accept="image/*"><img id="preview" class="preview">
<label>Nom du tatouage</label><input id="name" required placeholder="Ex. Dragon japonais">
<label>Date</label><input id="date" type="date" required>
<label>Style</label><select id="style"><option>Réaliste</option><option>Noir & gris</option><option>Couleur</option><option>Japonais</option><option>Old school</option><option>Minimaliste</option><option>Autre</option></select>
<label>Client / référence</label><input id="client" placeholder="Facultatif">
<label>Notes</label><textarea id="notes" placeholder="Emplacement, taille, détails…"></textarea>
<button class="save">Enregistrer le tatouage</button>
</form></div></div>

<div class="detail" id="detail"><div class="detailBox"><img id="dimg"><div class="detailInfo"><h2 id="dname"></h2><div class="meta" id="dmeta"></div><p id="dnotes"></p><div class="actions"><button id="edit">Modifier</button><button id="delete" class="danger">Supprimer</button><button id="closeDetail">Fermer</button></div></div></div></div>

<script>
const KEY="mes_tatouages_collection_36_v1", TOTAL=36;
let items=JSON.parse(localStorage.getItem(KEY)||"[]"), photoData="", selected=null;\nlet capacity=Math.max(60,Number(localStorage.getItem(KEY+"_capacity")||60));
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});

function render(){
 let list=[...items],q=$("search").value.toLowerCase().trim(),sort=document.querySelector(".tab.active").dataset.sort;
 list=list.filter(x=>(x.name+" "+x.style+" "+x.client+" "+x.notes).toLowerCase().includes(q));
 if(sort==="new")list.sort((a,b)=>b.date.localeCompare(a.date));
 if(sort==="old")list.sort((a,b)=>a.date.localeCompare(b.date));
 if(sort==="az")list.sort((a,b)=>a.name.localeCompare(b.name));
 $("count").textContent=`${items.length} / ${TOTAL}`;
 let out="";
 for(let i=0;i<capacity;i++){
   const x=list[i];
   if(x) out+=`<article class="card" data-id="${x.id}"><img src="${x.photo}" alt=""><div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${fmt(x.date)}</div></div></article>`;
   else out+=`<button type="button" class="slot" data-add><span class="plus">+</span><small>Ajouter</small></button>`;
 }
 $("grid").innerHTML=out;
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm());
 document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}
function openForm(x=null){
 $("formOverlay").classList.add("open");$("form").reset();photoData="";$("preview").style.display="none";$("editId").value="";$("date").value=new Date().toISOString().slice(0,10);
 $("formTitle").textContent=x?"Modifier le tatouage":"Ajouter un tatouage";
 if(x){$("editId").value=x.id;$("name").value=x.name;$("date").value=x.date;$("style").value=x.style;$("client").value=x.client||"";$("notes").value=x.notes||"";photoData=x.photo;$("preview").src=x.photo;$("preview").style.display="block";}
}
$("addTop").onclick=()=>openForm();$("closeForm").onclick=()=>$("formOverlay").classList.remove("open");
$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photoData=r.result;$("preview").src=photoData;$("preview").style.display="block"};r.readAsDataURL(f)};
$("form").onsubmit=e=>{e.preventDefault();if(!photoData){alert("Ajoute une photo.");return}let id=$("editId").value||crypto.randomUUID(),x={id,photo:photoData,name:$("name").value,date:$("date").value,style:$("style").value,client:$("client").value,notes:$("notes").value},i=items.findIndex(a=>a.id===id);if(i<0)items.push(x);else items[i]=x;save();$("formOverlay").classList.remove("open");render()};
function openDetail(id){selected=items.find(x=>x.id===id);$("dimg").src=selected.photo;$("dname").textContent=selected.name;$("dmeta").textContent=fmt(selected.date)+" · "+selected.style+(selected.client?" · "+selected.client:"");$("dnotes").textContent=selected.notes||"";$("detail").classList.add("open")}
$("closeDetail").onclick=()=>$("detail").classList.remove("open");
$("edit").onclick=()=>{let x=selected;$("detail").classList.remove("open");openForm(x)};
$("delete").onclick=()=>{if(confirm("Supprimer ce tatouage ?")){items=items.filter(x=>x.id!==selected.id);save();$("detail").classList.remove("open");render()}};
$("search").oninput=render;\n$("addMore").onclick=()=>{capacity+=12;localStorage.setItem(KEY+"_capacity",capacity);render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
render();
const vp=$("boardViewport");
requestAnimationFrame(()=>{vp.scrollLeft=0;vp.scrollTop=0});
</script>
</body>
</html>
